#
# General settings to disable features and minimize the installation footprint.
#

# Disable building universal binaries to optimize for
# the native architecture only, improving performance and reducing disk usage.
-universal

# Disable debug build to minimize the size and potentially increase
# performance by removing debugging symbols that are not needed in production.
-debug -dtrace -memdebug

# Disable X11 (GUI) support and authentication for headless or GUI-less
# setups, ideal for server environments or apps without a GUI.
-x11 -xauth +no_x11

# Suppress installation of documentation to save disk space,
# useful for environments where online resources are preferred.
-doc -docs


#
# Performance and architecture-specific optimizations.
#

# Compile ports with optimizations specific to the native processor
# architecture, enhancing performance by leveraging CPU-specific features.
+native +optimizations

# Enable thread support, beneficial for multi-threaded
# applications by allowing more efficient use of CPU resources.
+threads

#+opencl


#
# Compiler and language support settings.
#

# Specify the default GCC version, ensuring consistency
# across builds and compatibility with a wide range of software.
-gcc12 -gcc11 -gcc10 -gcc9 -gcc8 -gcc7 -gcc6 -gcc5 -gcc49 -gcc48 -gcc47 -gcc46 -gcc45 -gcc44 -gcc43
+openmpi

# Enable Clang version 18, providing a
# modern compiler toolchain for building and optimizing software.
#+clang21 +libstdcxx
#+libstdcxx
#+clang19 -clang18 +libstdcxx
#+clang19 +libstdcxx
+libstdcxx

# gtest
+shared_libs

# libheif
-examples
-tests

#
# Programming languages and runtime environments.
#

# Specify the default Perl version to ensure script
# compatibility and streamline the development environment.
#+perl5.38 +perl5_38 -perl5.36 -perl5_36 -perl5.32 -perl5_32 -perl5.30 -perl5_30 -perl5.28 -perl5_28 -perl5.26 -perl5_26 -perl5.22 -perl5_22 -perl5.20 -perl5_20 -perl5.18 -perl5_18 -perl5.16 -perl5_16
+perl5.38 +perl5_38 -perl5.32 -perl5_32 -perl5.30 -perl5_30 -perl5.28 -perl5_28 -perl5.26 -perl5_26 -perl5.22 -perl5_22 -perl5.20 -perl5_20 -perl5.18 -perl5_18 -perl5.16 -perl5_16

# Optimize for a specific Python interpreter version, ensuring consistency
# in Python environments and compatibility with Python-based software.
#+python +python313 -python311 -python310 -python39 -python38 -python37 -python36 -python35 -python27
+python -python311 -python310 -python39 -python38 -python37 -python36 -python35 -python27

# Tailor the Ruby environment by setting the default Ruby version,
# optimizing for specific Ruby applications or development requirements.
+ruby33 -ruby32 -ruby31 -ruby30
+gmp +jemalloc


#
# Development Tools and Scripting Language Support
#

# Enhance Vim with scripting languages support and Lua, enabling advanced
# scripting capabilities for customization and automation within the editor.
+perl +tcl +lua

# Enable SVN support in Git for interoperability with Subversion repositories,
# facilitating a broader range of version control operations.
+svn


#
# File and Text Processing Enhancements
#

# Ensure iconv support in unzip, facilitating character encoding
# conversions for archives containing files with various character encodings.
+iconv

# Enable extra regex matching capabilities, potentially enhancing
# text processing and pattern matching in ports that utilize PCRE.
+regex_match_extra

# Enable Perl Compatible Regular Expressions (PCRE) for advanced
# regex pattern matching capabilities, similar to Perl,
# enhancing text processing in ports that support it.
+pcre

# Enable Readline for improved line-editing, history,
# and interactive input features in command-line applications.
+readline


#
# Network Enhancements and Protocols
#

# Enable remote and local packet capture with libpcap, ideal for
# network analysis and security monitoring in complex environments.
+remote

# Enable HTTP/2 support via nghttp2 library in Unbound, enhancing
# DNS-over-HTTPS (DoH) communication for improved performance and efficiency.
+nghttp2

# Enhance curl with additional protocols and features, making it
# a more versatile tool for data transfer across a variety of protocols.
+ares +http2 +sftp_scp +rtmp
#+ares +http3 +http2 +sftp_scp +rtmp

# libproxy
+curl

# Configure OpenSSH with additional security features,
# enhancing secure remote administration capabilities.
+ldns +fido2

# Ensure SSL support for secure network communications,
# crucial for encrypted data transfer and secure connections.
+ssl
+openssl

# Enhance GnuTLS with modern compression (Brotli) and DNSSEC support (DANE)
# for improved security and performance in secure communications.
+brotli +dane


#
# Virtual Networking and Emulation
#

# Enable VDE support in QEMU for advanced network virtualization capabilities,
# facilitating complex network simulations or virtual network configurations.
+vde

# Enable TAP virtual network device support in VDE2, allowing the creation and
# management of virtual Ethernet devices for network simulation and bridging.
+tuntap


#
# Image and video processing settings.
#

# pandoc
+full_latex_dependencies

# Enable GhostPDL support in Ghostscript for additional capabilities in
# processing Page Description Languages (PDLs) like PostScript, PDF, and XPS.
+ghostpdl

# Enhance TIFF support with JBIG for handling more image formats,
# particularly useful for high-compression b/w images.
+jbig

# Enable High Efficiency Image File Format (HEIF) support in Jasper,
# supporting modern image formats for higher compression efficiency.
+heif

# Configure x265 with high bit depth support to enhance
# video encoding capabilities, supporting higher quality video formats.
+highdepth

# Enhance ImageMagick with additional format support for comprehensive
# image processing capabilities across a wider range of formats.
+graphviz +lqr +pango +rsvg +wmf

# Configure FFmpeg with additional codecs and features for comprehensive
# multimedia processing, supporting a broader range of audio and video formats.
+librtmp +nonfree +rav1e +flite

# libzzip
#+sdl


